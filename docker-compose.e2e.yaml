services:
  grafana:
    container_name: 'grafana-pyroscope-app'
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.0.0}
    ports:
      - ${GRAFANA_PORT:-3000}:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-pyroscope-app
      - ./samples/provisioning:/etc/grafana/provisioning
      - ./samples/dashboards:/var/lib/grafana/dashboards
    environment:
      # prevents a Grafana startup error in case a newer plugin version (set in package.json) is used compared to the latest one published in the catalog
      GF_PLUGINS_PREINSTALL_DISABLED: true
      GF_INSTALL_PLUGINS: grafana-llm-app
      OPENAI_API_KEY: $OPENAI_API_KEY
      OPENAI_ORGANIZATION_ID: $OPENAI_ORGANIZATION_ID
      GF_FEATURE_TOGGLES_ENABLE: metricsFromProfiles

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant-storage:/qdrant/storage

  pyroscope:
    container_name: 'pyroscope-static-e2e'
    build:
      dockerfile: ./Dockerfile.pyroscope.e2e
      context: .
    ports:
      - 4100:4100/tcp
    environment:
      GITHUB_CLIENT_ID: $GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: $GITHUB_CLIENT_SECRET
      GITHUB_SESSION_SECRET: $GITHUB_SESSION_SECRET

  # e2e testing
  playwright:
    network_mode: host
    container_name: 'playwright-e2e'
    build:
      dockerfile: Dockerfile.plugin.e2e
      context: .
    volumes:
      - ./e2e:/app/e2e
      - ./src:/app/src
    command: ${PLAYWRIGHT_ARGS:-}
    profiles: [ playwright ]
    environment:
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      GRAFANA_IMAGE: ${GRAFANA_VERSION:-grafana-enterprise}
      GRAFANA_VERSION: ${GRAFANA_VERSION:-11.6.4}

volumes:
  qdrant-storage:
