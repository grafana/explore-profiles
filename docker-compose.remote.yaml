services:
  grafana:
    container_name: 'grafana-pyroscope-app'
    build:
      dockerfile: ./Dockerfile.remote
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.3.0}
        backendUrl: ${REMOTE_BACKEND_URL}
        basicAuthUser: ${REMOTE_BASIC_AUTH_USER}
        basicAuthPassword: ${REMOTE_BASIC_AUTH_PASSWORD}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-pyroscope-app
    environment:
      GF_INSTALL_PLUGINS: grafana-llm-app
      OPENAI_API_KEY: $OPENAI_API_KEY
      OPENAI_ORGANIZATION_ID: $OPENAI_ORGANIZATION_ID
      GF_FEATURE_TOGGLES_ENABLE: localizationForPlugins

  qdrant:
    image: qdrant/qdrant@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
