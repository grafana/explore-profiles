packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Five days in minutes (5 × 24 × 60).
minimumReleaseAge: 7200
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  '@swc/core': true
  esbuild: true
  rolldown: true
  unrs-resolver: true

overrides:
  chokidar: '>=5.0.0'
  semver@6: 7.8.0
  ua-parser-js: '>=2.0.10'
  react-redux: '>=9.3.0'
  undici-types: '>=6.25.0'
  esbuild: ~0.28.1
  i18next: ~26.0.5
  lodash: ~4.18.1
  minimatch@^5: ~5.1.9
  minimatch@^9: ~9.0.9
  ajv@^8: ~8.18.0
  dompurify: ~3.4.11
  hono: '>=4.12.25'
  js-yaml: '>=4.2.0'
  '@opentelemetry/core': '>=2.8.0'
  immutable: ~5.1.5
  js-cookie: '>=3.0.7'
  protobufjs: '>=8.2.0'
  protocol-buffers-schema: ~3.6.1
  qs: ~6.15.2
  serialize-javascript: ~7.0.5
  uuid: '>=11.1.1'
  ws: '>=8.20.1'
