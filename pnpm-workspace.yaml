packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable lifecycle scripts like husky git hooks such as postinstall.
ignoreScripts: true
# One week in minutes (7 × 24 × 60).
minimumReleaseAge: 10080
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  '@swc/core': true
  esbuild: true
  rolldown: true
  unrs-resolver: true

overrides:
  # Profiles Drilldown does not import react-data-grid; @grafana/ui pulls it in transitively as
  # github:grafana/react-data-grid#<commit>, which blockExoticSubdeps rejects for subdependencies.
  # Map the package name to @grafana/react-data-grid on npm so resolution stays on the registry.
  # Keep in sync with the optional root dependency in package.json. The npm version may differ from
  # UI's pinned git commit; re-check when upgrading @grafana/ui.
  react-data-grid: npm:@grafana/react-data-grid@7.0.0-beta.58
  chokidar: '>=5.0.0'
  semver@6: 7.8.1
  ua-parser-js: '>=2.0.10'
  react-redux: '>=9.3.0'
  undici-types: '>=6.25.0'
  esbuild: ~0.28.0
  i18next: ~26.0.5
  lodash: ~4.18.1
  minimatch@^5: ~5.1.9
  minimatch@^9: ~9.0.9
  ajv@^8: ~8.18.0
  dompurify: ~3.4.0
  immutable: ~5.1.5
  js-cookie: '>=3.0.7'
  protobufjs: '>=8.2.0'
  protocol-buffers-schema: ~3.6.1
  qs: ~6.15.2
  serialize-javascript: ~7.0.5
  uuid: '>=11.1.1'
  ws: '>=8.20.1'
